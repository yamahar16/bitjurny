# 괴담 쇼츠 자동 게시: upload_queue/ 에 영상이 push 되면 유튜브에 업로드 (예약 공개)
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   YOUTUBE_TOKEN_JSON  (PC의 youtube_token.json 내용 전체)
#   또는 YOUTUBE_CLIENT_ID + YOUTUBE_CLIENT_SECRET (+ horror-youtube-auth 로 폰 로그인 한 번)
name: horror-upload

on:
  push:
    paths:
      - "upload_queue/**"
  workflow_dispatch:

concurrency:
  group: horror-upload
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-horror.txt cryptography
      - name: Upload queued shorts
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ] && [ -z "$YOUTUBE_CLIENT_SECRET" ]; then
            echo "::warning::유튜브 비밀값(YOUTUBE_TOKEN_JSON 또는 YOUTUBE_REFRESH_TOKEN 등)이 아직 없습니다. 영상은 대기열에 그대로 남습니다."
            exit 0
          fi
          python -m horror_shorts upload-queue
      - name: Record results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A upload_queue
          git diff --cached --quiet || (git commit -m "자동 게시 결과 기록 [skip ci]" && git pull --rebase && git push)
