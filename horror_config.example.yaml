# 복사해서 horror_config.yaml 로 저장하면 기본값을 덮어씁니다.
script:
  model: claude-opus-5-5     # claude-sonnet-5-5 / claude-haiku-5-5 로 바꾸면 더 저렴
  effort: high
  rules: 4
  target_seconds: 55
voice:
  voice: ko-KR-InJoonNeural  # 여성: ko-KR-SunHiNeural
  rate: "+12%"
  pitch: "-6Hz"
  sentence_gap: 0.3
images:
  provider: procedural       # procedural(무료 테스트) | kling(API) | manual(직접 넣기)
render:
  final_crf: 23
  max_bitrate: 10M
  bgm_volume: 0.22
upload:
  privacy: private           # 검수 후 Studio에서 공개 전환
